<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reader</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: sans-serif;
      background: white;
      color: black;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }
    header {
      padding: 8px 12px;
      border-bottom: 1px solid black;
    }
    main {
      display: grid;
      grid-template-columns: 1.4fr 360px;
      min-height: 0;
    }
    section {
      border: 1px solid black;
      margin: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h2 {
      margin: 0;
      padding: 8px;
      border-bottom: 1px solid black;
      font-size: 14px;
      font-weight: 600;
    }
    .camera {
      margin-right: 0;
    }
    .camera h2 {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .camera h2 span { flex: 1; }
    .camera h2 select, .camera h2 button { font: inherit; font-weight: normal; }
    .camera .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera .stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    aside {
      display: grid;
      grid-template-rows: auto 1fr 1fr;
      min-height: 0;
    }
    aside section { margin-left: 0; }
    aside section.settings { overflow: auto; max-height: 55vh; }
    ul { list-style: none; margin: 0; padding: 8px; }
    li { margin: 4px 0; }
    .group { margin: 8px 8px 0; font-size: 12px; }
    .rect-manual { padding: 0 8px 8px; font-size: 12px; }
    .rect-manual[hidden] { display: none; }
    .rect-hand { margin-top: 6px; font-weight: 600; }
    .rect-grid {
      display: grid;
      grid-template-columns: 64px 1fr 34px;
      align-items: center;
      gap: 4px 6px;
      margin-top: 4px;
    }
    .rect-grid input[type="range"] { width: 100%; margin: 0; }
    .rect-val { text-align: right; font-variant-numeric: tabular-nums; }
    .queue { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid black; }
  </style>
</head>
<body>
  <header>Reader</header>
  <main>
    <section class="camera">
      <h2>
        <span>Camera</span>
        <select id="camera-select" disabled><option>Scanning...</option></select>
        <button id="camera-rescan" type="button" disabled>Rescan</button>
      </h2>
      <div class="stage">
        <img id="camera" alt="Camera" src="/video">
      </div>
    </section>
    <aside>
      <section class="settings">
        <h2>Active inputs</h2>
        <div class="group">Triggers</div>
        <ul>
          <li><label><input type="checkbox" data-key="L:closed_fist"> Left closed fist</label></li>
          <li><label><input type="checkbox" data-key="R:closed_fist"> Right closed fist</label></li>
          <li><label><input type="checkbox" data-key="L:open_palm"> Left open palm</label></li>
          <li><label><input type="checkbox" data-key="R:open_palm"> Right open palm</label></li>
        </ul>
        <div class="group">Sliders</div>
        <ul>
          <li><label><input type="checkbox" data-key="L:palm_x"> Left palm X</label></li>
          <li><label><input type="checkbox" data-key="L:palm_y"> Left palm Y</label></li>
          <li><label><input type="checkbox" data-key="L:palm_z"> Left palm Z</label></li>
          <li><label><input type="checkbox" data-key="R:palm_x"> Right palm X</label></li>
          <li><label><input type="checkbox" data-key="R:palm_y"> Right palm Y</label></li>
          <li><label><input type="checkbox" data-key="R:palm_z"> Right palm Z</label></li>
        </ul>
        <div class="group">Rectangles</div>
        <ul>
          <li><label><input type="checkbox" id="rect-auto" checked> Automatic rectangles</label></li>
        </ul>
        <div id="rect-manual" class="rect-manual" hidden>
          <div class="rect-hand">Left hand (red)</div>
          <div class="rect-grid">
            <label for="rect-L-cx">Center X</label>
            <input type="range" id="rect-L-cx" data-hand="L" data-field="center_x" min="0" max="1" step="0.01" value="0.25">
            <span class="rect-val" id="val-L-cx">0.25</span>
            <label for="rect-L-cy">Center Y</label>
            <input type="range" id="rect-L-cy" data-hand="L" data-field="center_y" min="0" max="1" step="0.01" value="0.50">
            <span class="rect-val" id="val-L-cy">0.50</span>
            <label for="rect-L-w">Width X</label>
            <input type="range" id="rect-L-w" data-hand="L" data-field="width" min="0" max="1" step="0.01" value="0.40">
            <span class="rect-val" id="val-L-w">0.40</span>
            <label for="rect-L-h">Height Y</label>
            <input type="range" id="rect-L-h" data-hand="L" data-field="height" min="0" max="1" step="0.01" value="0.70">
            <span class="rect-val" id="val-L-h">0.70</span>
          </div>
          <div class="rect-hand">Right hand (blue)</div>
          <div class="rect-grid">
            <label for="rect-R-cx">Center X</label>
            <input type="range" id="rect-R-cx" data-hand="R" data-field="center_x" min="0" max="1" step="0.01" value="0.75">
            <span class="rect-val" id="val-R-cx">0.75</span>
            <label for="rect-R-cy">Center Y</label>
            <input type="range" id="rect-R-cy" data-hand="R" data-field="center_y" min="0" max="1" step="0.01" value="0.50">
            <span class="rect-val" id="val-R-cy">0.50</span>
            <label for="rect-R-w">Width X</label>
            <input type="range" id="rect-R-w" data-hand="R" data-field="width" min="0" max="1" step="0.01" value="0.40">
            <span class="rect-val" id="val-R-w">0.40</span>
            <label for="rect-R-h">Height Y</label>
            <input type="range" id="rect-R-h" data-hand="R" data-field="height" min="0" max="1" step="0.01" value="0.70">
            <span class="rect-val" id="val-R-h">0.70</span>
          </div>
        </div>
      </section>
      <section class="queue">
        <h2>Trigger changes</h2>
        <table>
          <thead>
            <tr><th>Time</th><th>Hand</th><th>Control</th><th>Edge</th></tr>
          </thead>
          <tbody id="trigger-rows"></tbody>
        </table>
      </section>
      <section class="queue">
        <h2>Slider changes</h2>
        <table>
          <thead>
            <tr><th>Time</th><th>Hand</th><th>Control</th><th>Value</th></tr>
          </thead>
          <tbody id="slider-rows"></tbody>
        </table>
      </section>
    </aside>
  </main>
  <script>
    const boxes = document.querySelectorAll("input[data-key]");
    const triggerRows = document.getElementById("trigger-rows");
    const sliderRows = document.getElementById("slider-rows");
    let cursor = 0;

    function prependRow(body, cells) {
      const row = document.createElement("tr");
      for (const text of cells) {
        const cell = document.createElement("td");
        cell.textContent = text;
        row.appendChild(cell);
      }
      body.insertBefore(row, body.firstChild);
      while (body.children.length > 200) {
        body.removeChild(body.lastChild);
      }
    }

    function selectedKeys() {
      return Array.from(boxes).filter((box) => box.checked).map((box) => box.dataset.key);
    }

    async function saveEnabled() {
      await fetch("/api/enabled", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: selectedKeys() })
      });
    }

    async function loadEnabled() {
      const response = await fetch("/api/enabled");
      const data = await response.json();
      const enabled = new Set(data.enabled);
      for (const box of boxes) {
        box.checked = enabled.has(box.dataset.key);
      }
    }

    async function poll() {
      const response = await fetch("/api/events?after=" + cursor);
      const data = await response.json();
      for (const event of data.events) {
        cursor = event.n;
        if (event.kind === "trigger") {
          prependRow(triggerRows, [event.time, event.hand, event.control, event.edge]);
        } else {
          prependRow(sliderRows, [event.time, event.hand, event.control, String(event.value)]);
        }
      }
    }

    const cameraSelect = document.getElementById("camera-select");
    const cameraRescan = document.getElementById("camera-rescan");

    function setScanning(scanning) {
      cameraSelect.disabled = scanning;
      cameraRescan.disabled = scanning;
      cameraRescan.textContent = scanning ? "Scanning..." : "Rescan";
    }

    async function loadCameras() {
      setScanning(true);
      try {
        const [listResponse, currentResponse] = await Promise.all([
          fetch("/api/cameras"),
          fetch("/api/camera")
        ]);
        const cameras = (await listResponse.json()).cameras;
        const current = (await currentResponse.json()).index;
        cameraSelect.innerHTML = "";
        if (!cameras.some((camera) => camera.index === current)) {
          cameras.unshift({ index: current, name: "Camera " + current, status: "not found" });
        }
        for (const camera of cameras) {
          const option = document.createElement("option");
          option.value = String(camera.index);
          option.textContent = camera.status === "ok" ? camera.name : camera.name + " - " + camera.status;
          option.selected = camera.index === current;
          cameraSelect.appendChild(option);
        }
      } finally {
        setScanning(false);
      }
    }

    cameraSelect.addEventListener("change", async () => {
      await fetch("/api/camera", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index: Number(cameraSelect.value) })
      });
    });
    cameraRescan.addEventListener("click", loadCameras);
    loadCameras();

    for (const box of boxes) {
      box.disabled = true;
      box.addEventListener("change", saveEnabled);
    }

    const rectAuto = document.getElementById("rect-auto");
    const rectManual = document.getElementById("rect-manual");
    const rectSliders = document.querySelectorAll("#rect-manual input[type='range']");

    function syncRectLabels() {
      rectManual.hidden = rectAuto.checked;
      for (const slider of rectSliders) {
        const display = slider.nextElementSibling;
        if (display) {
          display.textContent = Number(slider.value).toFixed(2);
        }
      }
    }

    function collectRectanglesPayload() {
      const payload = {
        automatic: rectAuto.checked,
        L: {},
        R: {}
      };
      for (const slider of rectSliders) {
        payload[slider.dataset.hand][slider.dataset.field] = Number(slider.value);
      }
      return payload;
    }

    async function saveRectangles() {
      syncRectLabels();
      try {
        await fetch("/api/rectangles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(collectRectanglesPayload())
        });
      } catch (err) {
        // Ignore network errors while server endpoint is unavailable
      }
    }

    async function loadRectangles() {
      try {
        const response = await fetch("/api/rectangles");
        if (!response.ok) {
          syncRectLabels();
          return;
        }
        const data = await response.json();
        rectAuto.checked = Boolean(data.automatic);
        for (const slider of rectSliders) {
          const handCfg = data[slider.dataset.hand];
          if (handCfg && typeof handCfg[slider.dataset.field] === "number") {
            slider.value = String(handCfg[slider.dataset.field]);
          }
        }
      } catch (err) {
        // Keep defaults if endpoint is not yet active
      }
      syncRectLabels();
    }

    rectAuto.addEventListener("change", saveRectangles);
    for (const slider of rectSliders) {
      slider.addEventListener("input", saveRectangles);
    }

    Promise.all([loadEnabled(), loadRectangles()]).then(() => {
      for (const box of boxes) {
        box.disabled = false;
      }
      poll();
    });
    setInterval(poll, 200);
  </script>
</body>
</html>
