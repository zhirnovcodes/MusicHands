<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reader</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: sans-serif;
      background: white;
      color: black;
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }
    header {
      padding: 8px 12px;
      border-bottom: 1px solid black;
    }
    main {
      display: grid;
      grid-template-columns: 1.4fr 360px;
      min-height: 0;
    }
    section {
      border: 1px solid black;
      margin: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    h2 {
      margin: 0;
      padding: 8px;
      border-bottom: 1px solid black;
      font-size: 14px;
      font-weight: 600;
    }
    .camera {
      margin-right: 0;
    }
    .camera h2 {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .camera h2 span { flex: 1; }
    .camera h2 select, .camera h2 button { font: inherit; font-weight: normal; }
    .camera .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera .stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    aside {
      display: grid;
      grid-template-rows: auto 1fr 1fr;
      min-height: 0;
    }
    aside section { margin-left: 0; }
    ul { list-style: none; margin: 0; padding: 8px; }
    li { margin: 4px 0; }
    .group { margin: 8px 8px 0; font-size: 12px; }
    .queue { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid black; }
  </style>
</head>
<body>
  <header>Reader</header>
  <main>
    <section class="camera">
      <h2>
        <span>Camera</span>
        <select id="camera-select" disabled><option>Scanning...</option></select>
        <button id="camera-rescan" type="button" disabled>Rescan</button>
      </h2>
      <div class="stage">
        <img id="camera" alt="Camera" src="/video">
      </div>
    </section>
    <aside>
      <section>
        <h2>Active inputs</h2>
        <div class="group">Triggers</div>
        <ul>
          <li><label><input type="checkbox" data-key="L:closed_fist"> Left closed fist</label></li>
          <li><label><input type="checkbox" data-key="R:closed_fist"> Right closed fist</label></li>
          <li><label><input type="checkbox" data-key="L:open_palm"> Left open palm</label></li>
          <li><label><input type="checkbox" data-key="R:open_palm"> Right open palm</label></li>
        </ul>
        <div class="group">Sliders</div>
        <ul>
          <li><label><input type="checkbox" data-key="L:palm_x"> Left palm X</label></li>
          <li><label><input type="checkbox" data-key="L:palm_y"> Left palm Y</label></li>
          <li><label><input type="checkbox" data-key="L:palm_z"> Left palm Z</label></li>
          <li><label><input type="checkbox" data-key="R:palm_x"> Right palm X</label></li>
          <li><label><input type="checkbox" data-key="R:palm_y"> Right palm Y</label></li>
          <li><label><input type="checkbox" data-key="R:palm_z"> Right palm Z</label></li>
        </ul>
      </section>
      <section class="queue">
        <h2>Trigger changes</h2>
        <table>
          <thead>
            <tr><th>Time</th><th>Hand</th><th>Control</th><th>Edge</th></tr>
          </thead>
          <tbody id="trigger-rows"></tbody>
        </table>
      </section>
      <section class="queue">
        <h2>Slider changes</h2>
        <table>
          <thead>
            <tr><th>Time</th><th>Hand</th><th>Control</th><th>Value</th></tr>
          </thead>
          <tbody id="slider-rows"></tbody>
        </table>
      </section>
    </aside>
  </main>
  <script>
    const boxes = document.querySelectorAll("input[data-key]");
    const triggerRows = document.getElementById("trigger-rows");
    const sliderRows = document.getElementById("slider-rows");
    let cursor = 0;

    function prependRow(body, cells) {
      const row = document.createElement("tr");
      for (const text of cells) {
        const cell = document.createElement("td");
        cell.textContent = text;
        row.appendChild(cell);
      }
      body.insertBefore(row, body.firstChild);
      while (body.children.length > 200) {
        body.removeChild(body.lastChild);
      }
    }

    function selectedKeys() {
      return Array.from(boxes).filter((box) => box.checked).map((box) => box.dataset.key);
    }

    async function saveEnabled() {
      await fetch("/api/enabled", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: selectedKeys() })
      });
    }

    async function loadEnabled() {
      const response = await fetch("/api/enabled");
      const data = await response.json();
      const enabled = new Set(data.enabled);
      for (const box of boxes) {
        box.checked = enabled.has(box.dataset.key);
      }
    }

    async function poll() {
      const response = await fetch("/api/events?after=" + cursor);
      const data = await response.json();
      for (const event of data.events) {
        cursor = event.n;
        if (event.kind === "trigger") {
          prependRow(triggerRows, [event.time, event.hand, event.control, event.edge]);
        } else {
          prependRow(sliderRows, [event.time, event.hand, event.control, String(event.value)]);
        }
      }
    }

    const cameraSelect = document.getElementById("camera-select");
    const cameraRescan = document.getElementById("camera-rescan");

    function setScanning(scanning) {
      cameraSelect.disabled = scanning;
      cameraRescan.disabled = scanning;
      cameraRescan.textContent = scanning ? "Scanning..." : "Rescan";
    }

    async function loadCameras() {
      setScanning(true);
      try {
        const [listResponse, currentResponse] = await Promise.all([
          fetch("/api/cameras"),
          fetch("/api/camera")
        ]);
        const cameras = (await listResponse.json()).cameras;
        const current = (await currentResponse.json()).index;
        cameraSelect.innerHTML = "";
        if (!cameras.some((camera) => camera.index === current)) {
          cameras.unshift({ index: current, name: "Camera " + current, status: "not found" });
        }
        for (const camera of cameras) {
          const option = document.createElement("option");
          option.value = String(camera.index);
          option.textContent = camera.status === "ok" ? camera.name : camera.name + " - " + camera.status;
          option.selected = camera.index === current;
          cameraSelect.appendChild(option);
        }
      } finally {
        setScanning(false);
      }
    }

    cameraSelect.addEventListener("change", async () => {
      await fetch("/api/camera", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index: Number(cameraSelect.value) })
      });
    });
    cameraRescan.addEventListener("click", loadCameras);
    loadCameras();

    for (const box of boxes) {
      box.disabled = true;
      box.addEventListener("change", saveEnabled);
    }
    loadEnabled().then(() => {
      for (const box of boxes) {
        box.disabled = false;
      }
      poll();
    });
    setInterval(poll, 200);
  </script>
</body>
</html>
